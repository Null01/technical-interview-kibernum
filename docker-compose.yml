services:

  # ── Infrastructure ───────────────────────────────────────────────────────────

  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"
      - "${KAFKA_EXTERNAL_PORT:-9094}:9094"
    environment:

      # KRaft
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # Listeners
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094

      # Internal Docker communication + External Host communication
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-9094}

      # Protocols
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT

      # Controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # Replication
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      # Cluster
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

      # Topics
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - microservices-net
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${KAFKA_BROKER:-kafka:9092}
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - microservices-net
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: inventory_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./docker/postgres/inventory_ddl.sql:/docker-entrypoint-initdb.d/02_inventory_ddl.sql
      - ./docker/postgres/inventory_dml.sql:/docker-entrypoint-initdb.d/03_inventory_dml.sql
      - ./docker/postgres/orders_ddl.sql:/docker-entrypoint-initdb.d/04_orders_ddl.sql
      - ./docker/postgres/orders_dml.sql:/docker-entrypoint-initdb.d/05_orders_dml.sql
      - ./docker/postgres/payments_ddl.sql:/docker-entrypoint-initdb.d/06_payments_ddl.sql
      - ./docker/postgres/payments_dml.sql:/docker-entrypoint-initdb.d/07_payments_dml.sql
    networks:
      - microservices-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d inventory_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  sonarqube-db:
    image: postgres:16-alpine
    container_name: sonarqube-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonarqube
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    networks:
      - microservices-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sonar} -d sonarqube" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  sonarqube:
    image: sonarqube:10-community
    container_name: sonarqube
    restart: unless-stopped
    depends_on:
      sonarqube-db:
        condition: service_healthy
    ports:
      - "${SONAR_PORT:-9000}:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
      # Desactiva los checks de bootstrap de Elasticsearch en desarrollo.
      # En producción configurar vm.max_map_count=262144 en el host.
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc:
        soft: 8192
        hard: 8192
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - microservices-net
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:9000/api/system/status | grep -qE '\"status\":\"UP\"'" ]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 90s

